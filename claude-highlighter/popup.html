<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text h1 {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .logo-text p {
      font-size: 11px;
      color: #64748b;
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 12px 0;
    }
    .how-to {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .how-to strong {
      color: #94a3b8;
    }
    .step {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .step-num {
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      font-size: 10px;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .open-btn {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: system-ui, sans-serif;
    }
    .open-btn:hover { background: #4f46e5; }
    .note {
      font-size: 11px;
      color: #475569;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>Claude Highlighter</h1>
      <p>Annotate your conversations</p>
    </div>
  </div>

  <div class="divider"></div>

  <div class="how-to">
    <div class="step">
      <div class="step-num">1</div>
      <div><strong>Select text</strong> in any Claude response — a toolbar appears</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div>Click <strong>Highlight</strong> to save that excerpt</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div>Collect as many highlights as you want from the conversation</div>
    </div>
    <div class="step">
      <div class="step-num">4</div>
      <div>Type your question in the sidebar and click <strong>Ask Claude</strong></div>
    </div>
  </div>

  <button class="open-btn" id="open-sidebar">Open on Claude.ai →</button>
  <p class="note">Only works on claude.ai</p>

  <script>
    document.getElementById('open-sidebar').addEventListener('click', () => {
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        const tab = tabs[0];
        if (tab && tab.url && tab.url.includes('claude.ai')) {
          chrome.scripting.executeScript({
            target: { tabId: tab.id },
            func: () => {
              const btn = document.getElementById('ch-toggle-btn');
              if (btn) btn.click();
            }
          });
          window.close();
        } else {
          chrome.tabs.create({ url: 'https://claude.ai' });
        }
      });
    });
  </script>
</body>
</html>
